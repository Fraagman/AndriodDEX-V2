[package]
name = "rust_quic_server"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
quinn = "0.11"
tokio = { version = "1.37", features = ["rt", "rt-multi-thread", "sync", "macros", "net"] }
prost = "0.12"
bytes = "1.6"
jni = "0.21"
rustls = "0.23"
rcgen = "0.12"
lazy_static = "1.4"
android_logger = "0.15.1"
log = "0.4.30"
