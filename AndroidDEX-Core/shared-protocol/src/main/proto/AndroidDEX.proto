syntax = "proto3";

package androiddex;

option java_package = "com.androiddex.shared";
option java_multiple_files = true;

enum CodecType {
    H264 = 0;
    HEVC = 1;
}

enum FrameType {
    KEY_FRAME = 0;
    DELTA_FRAME = 1;
}

message EncodedVideoFrame {
    CodecType codec = 1;
    int32 width = 2;
    int32 height = 3;
    int64 timestamp_us = 4;
    FrameType frame_type = 5;
    int64 sequence_number = 6;
    bytes payload = 7;
}

message InputEvent {
    enum Type {
        TOUCH = 0;
        MOUSE = 1;
        KEYBOARD = 2;
        SCROLL = 3;
    }
    Type type = 1;
    float x = 2;
    float y = 3;
    int32 action = 4;
    int32 key_code = 5;
}
