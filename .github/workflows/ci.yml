name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  receiver:
    name: Rust receiver (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-receiver
      - name: Format check
        working-directory: rust-receiver
        run: cargo fmt --check
      - name: Clippy
        working-directory: rust-receiver
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        working-directory: rust-receiver
        run: cargo test --workspace

  phone-native:
    name: Phone native crate (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android-host/rust_quic_server
      # The phone crate's tests run on the host (they are #[cfg(test)] unit and
      # loopback-QUIC tests; only the JNI entry points need a real Android).
      - name: Tests
        working-directory: android-host/rust_quic_server
        run: cargo test

  android:
    name: Android app (test, lint, assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Unit tests
        working-directory: android-host
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Lint
        working-directory: android-host
        run: ./gradlew :app:lintDebug --console=plain
      - name: Assemble debug
        working-directory: android-host
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Protoc regeneration check (no stale generated code)
        working-directory: android-host
        run: ./gradlew :app:generateProtoJava --console=plain

  wire-format:
    name: Wire-format cross-check (Kotlin vs Rust golden vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-receiver
      - name: Rust golden vectors
        working-directory: rust-receiver
        run: cargo test -p zc-protocol
      # The Kotlin side of the same vector runs inside the android job's unit
      # tests (AudioPacketGoldenTest) — both sides of the wire are pinned in CI.
