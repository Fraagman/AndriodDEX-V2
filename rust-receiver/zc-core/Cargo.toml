[package]
name = "zc-core"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "=0.29.15"
zc-protocol = { path = "../zc-protocol" }
zc-network = { path = "../zc-network" }
zc-input = { path = "../zc-input" }
zc-video = { path = "../zc-video" }
prost = "=0.13.5"
tokio = { version = "=1.52.3", features = ["rt", "rt-multi-thread", "macros", "time"] }
wgpu = { version = "=0.19.4" }
bytemuck = { version = "=1.25.0", features = ["derive"] }
pollster = "=0.3.0"
egui = "=0.27.2"
egui-wgpu = "=0.27.2"
egui-winit = { version = "=0.27.2", default-features = false, features = ["links"] }
zc-audio = { version = "0.1.0", path = "../zc-audio" }

[target.'cfg(windows)'.dependencies]
winreg = "=0.52.0"
