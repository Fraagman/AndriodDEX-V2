[package]
name = "zc-network"
version = "0.1.0"
edition = "2024"

[dependencies]
quinn = "=0.11.9"
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio = { version = "=1.52.3", features = ["rt", "rt-multi-thread", "macros", "io-util"] }
zc-security = { path = "../zc-security" }
zc-protocol = { path = "../zc-protocol" }
ring = "=0.17.14"
rand_core = "=0.6.4"
get_if_addrs = "=0.5.3"
futures-util = "=0.3.32"
ipconfig = "=0.3.4"

[dev-dependencies]
rcgen = "=0.13.2"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "time"] }
prost = "=0.13.5"
zc-protocol = { path = "../zc-protocol" }
