[package]
name = "zc-network"
version = "0.1.0"
edition = "2024"

[dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1.37", features = ["rt", "sync"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "net", "time"] }
