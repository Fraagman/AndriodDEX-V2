syntax = "proto3";
package protocol;

message MouseEvent {
  uint32 x = 1;
  uint32 y = 2;
  uint32 buttons = 3;
  uint64 timestamp = 4;
}

message KeyboardEvent {
  uint32 keycode = 1;
  bool pressed = 2;
  uint32 modifiers = 3;
  uint64 timestamp = 4;
}

message InputEvent {
  oneof event {
    MouseEvent mouse = 1;
    KeyboardEvent keyboard = 2;
  }
}
