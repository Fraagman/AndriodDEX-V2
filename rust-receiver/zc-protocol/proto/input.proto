syntax = "proto3";
package protocol;

option java_package = "com.androiddex.protocol";
option java_outer_classname = "InputProto";
option java_multiple_files = true;

// Modifier bitmask shared by MouseEvent and KeyboardEvent.
//
// The receiver reports the real modifier state from winit rather than making the
// phone reconstruct it from keypress history, which desynchronises whenever a
// modifier release is missed (classic symptom: Shift stuck on).
enum Modifier {
    MODIFIER_NONE = 0;
    MODIFIER_SHIFT = 1;
    MODIFIER_CTRL = 2;
    MODIFIER_ALT = 4;
    MODIFIER_SUPER = 8;
}

message MouseEvent {
    uint32 x = 1;
    uint32 y = 2;
    uint32 buttons = 3;
    uint64 timestamp = 4;
    uint32 modifiers = 5;
}

message KeyboardEvent {
    uint32 keycode = 1;
    bool pressed = 2;
    uint32 modifiers = 3;
    uint64 timestamp = 4;
}

// Mouse wheel. Values are in detents (notches), matching winit's LineDelta;
// positive v_scroll scrolls content away from the user, positive h_scroll right.
message ScrollEvent {
    uint32 x = 1;
    uint32 y = 2;
    float v_scroll = 3;
    float h_scroll = 4;
    uint64 timestamp = 5;
    uint32 modifiers = 6;
}

message KeyframeRequest {}

message TextEvent {
    string text = 1;
    uint64 timestamp = 2;
}

message OpenAppRequest {
    string package_name = 1;
}

// Global navigation (back / home / recents), performed on the phone through its
// DesktopAccessibilityService. The actions are no-ops on the phone when that
// optional service is not enabled.
message NavEvent {
    NavAction action = 1;
}

enum NavAction {
    NAV_BACK = 0;
    NAV_HOME = 1;
    NAV_RECENTS = 2;
}

message InputEvent {
    oneof event {
        MouseEvent mouse = 1;
        KeyboardEvent keyboard = 2;
        ScrollEvent scroll = 3;
        KeyframeRequest request_keyframe = 4;
        TextEvent text = 5;
        OpenAppRequest open_app = 6;
        NavEvent nav = 7;
    }
}
